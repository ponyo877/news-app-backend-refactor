<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - まとめくん</title>
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.SiteTitle}} | 2ch/5chまとめビューア「まとめくん」">
<meta property="og:type" content="article">
<meta property="og:url" content="{{.CanonicalURL}}">
<meta property="og:site_name" content="まとめくん">
{{if .ImageURL}}<meta property="og:image" content="{{.ImageURL}}">
<meta name="twitter:card" content="summary_large_image">
{{else}}<meta name="twitter:card" content="summary">
{{end}}<!-- iOS Safari純正スマートバナー: インストール済なら「開く」/ 未なら App Store -->
<meta name="apple-itunes-app" content="app-id=1546424384, app-argument={{.CanonicalURL}}">
<style>
  body { margin: 0; background: #303030; color: #fff; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; text-align: center; }
  img.thumb { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; background: #424242; }
  h1 { font-size: 20px; line-height: 1.5; margin: 16px 0 4px; text-align: left; }
  p.site { color: #EF9A9A; font-size: 14px; margin: 0 0 24px; text-align: left; }
  a.open-app { display: block; background: #607D8B; color: #fff; text-decoration: none; font-weight: bold; padding: 14px; border-radius: 28px; margin-bottom: 20px; }
  p.lead { color: rgba(255,255,255,0.7); font-size: 13px; margin: 0 0 12px; }
  a.store { display: block; color: #90CAF9; font-size: 14px; margin: 8px 0; }
</style>
</head>
<body>
<main>
  {{if .ImageURL}}<img class="thumb" src="{{.ImageURL}}" alt="">{{end}}
  <h1>{{.Title}}</h1>
  <p class="site">{{.SiteTitle}}</p>
  <a class="open-app" href="matomekun://a/{{.ID}}">アプリで開く</a>
  <p class="lead">まとめくんなら広告カットの読みやすい画面で読めます</p>
  <a class="store" href="https://apps.apple.com/jp/app/id1546424384">App Store で入手</a>
  <a class="store" href="https://play.google.com/store/apps/details?id=com.matomebeta_app">Google Play で入手</a>
</main>
</body>
</html>
